[package]
name = "dygma-cli"
version = "0.1.0"
edition = "2024"
authors = ["Jose Quesada <jquesada@fau.edu>"]

[dependencies]
async-hid = { version = "0.4.4", features = [
  "tokio",
], default-features = false }
bytes = "1.10.1"
clap = { version = "4.5.42", features = ["derive"] }
derive_more = { version = "2.0.1", features = ["full"] }
error-stack = "0.6.0"
futures = "0.3.31"
itertools = "0.14.0"
# Binary-only rendering of context-full error diagnostics (issue #16).
# Library code must not depend on this: the bridge lives in the CLI's
# `diagnostics` module. `fancy-no-syscall` (over the full `fancy`)
# suffices because the renderer picks its theme and pins its width
# itself — it never probes the terminal, so miette's `supports-*`,
# `terminal_size`, and `backtrace` machinery is dead weight here.
miette = { version = "7.6", default-features = false, features = [
  "fancy-no-syscall",
] }
macros = { path = "../macros" }
paste = "1.0.15"
pin-project = "1.1.10"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
strsim = "0.11.1"
tokio = { version = "1.47.0", features = ["full"] }
tokio-serial = "5.4.5"
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.16", features = ["full"] }
tracing = "0.1.41"
winnow = { version = "0.7.13", features = ["unstable-doc"] }
